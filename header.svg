<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <clipPath id="nameClip">
      <rect id="nameReveal" x="0" y="0" width="0" height="110" rx="4">
        <animate attributeName="width" from="0" to="860" dur="2.4s" fill="freeze"
                 calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" begin="0s"/>
      </rect>
    </clipPath>
    <clipPath id="roleClip">
      <rect x="0" y="198" width="840" height="48" rx="4"/>
    </clipPath>
  </defs>

  <rect width="840" height="320" fill="url(#bg)"/>

  <!-- moving highlight strip -->
  <rect x="0" y="0" width="840" height="6" fill="#1e293b"/>
  <rect x="0" y="0" width="180" height="6" fill="url(#hGrad)">
    <animateTransform attributeName="transform" type="translate" values="-200,0;860,0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <circle cx="120" cy="260" r="3" fill="#22d3ee" opacity="0.5">
    <animate attributeName="cy" values="290;50;290" dur="9s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="720" cy="240" r="4" fill="#a78bfa" opacity="0.5">
    <animate attributeName="cy" values="260;40;260" dur="11s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="11s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="620" cy="70" r="2.5" fill="#f59e0b" opacity="0.5">
    <animate attributeName="cy" values="90;260;90" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </circle>

  <!-- animated name reveal -->
  <g clip-path="url(#nameClip)">
    <text x="40" y="150" font-family="Segoe UI, -apple-system, sans-serif" font-size="66" font-weight="800" fill="url(#textGrad)">Martin Obe</text>
  </g>

  <!-- rotating roles (roller carousel) -->
  <g clip-path="url(#roleClip)">
    <g>
      <text x="40" y="222" font-family="Segoe UI, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1">
        <tspan fill="#22d3ee">&#9656; </tspan>Frontend Web Developer
      </text>
      <text x="40" y="266" font-family="Segoe UI, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1">
        <tspan fill="#a78bfa">&#9656; </tspan>Open Source Contributor
      </text>
      <text x="40" y="310" font-family="Segoe UI, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#cbd5e1">
        <tspan fill="#34d399">&#9656; </tspan>OD Student
      </text>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,0;0,-44;0,-44;0,-88;0,-88;0,0"
        keyTimes="0;0.30;0.333;0.633;0.667;0.967;1"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
        calcMode="spline" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="40" y="296" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" fill="#64748b">
    Building modern, user-focused web experiences with React, TypeScript &amp; Next.js.
  </text>
</svg>